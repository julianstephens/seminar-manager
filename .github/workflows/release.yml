name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: previous-tag
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | awk 'NR==2 {print; exit}')
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "tag=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_COMMIT=$(git rev-list --max-count=2 HEAD | tail -n 1)
          if [ -n "$PREVIOUS_COMMIT" ]; then
            echo "tag=$PREVIOUS_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.previous-tag.outputs.tag }}
          ref: ${{ github.sha }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/schemas/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/release.yml'
            web:
              - 'apps/web/**'
              - 'packages/db/**'
              - 'packages/schemas/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/release.yml'

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    env:
      SERVICE_MAP: >
        {
          "api": "apps/api/Dockerfile",
          "web": "apps/web/Dockerfile"
        }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set service path
        id: service-path
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          DOCKERFILE_PATH=$(echo '${{ env.SERVICE_MAP }}' | jq -r --arg name "$SERVICE_NAME" '.[$name]')
          echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.service-path.outputs.path }}
          push: true
          target: runner
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ steps.sha.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:cache,mode=max
          build-args: |
            ${{ matrix.service == 'web' && format('VITE_PROXY_TARGET={0}', secrets.VITE_PROXY_TARGET) || '' }}

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: always() && needs.detect-changes.outputs.services != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run coolify-deploy
        env:
          COOLIFY_ENDPOINT_URL: ${{ secrets.COOLIFY_ENDPOINT_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ENV_API: ${{ secrets.COOLIFY_ENV_API }}
          MANIFEST_PATH: ./coolify.manifest.json
          LOG_LEVEL: debug
        run: |
          if [ -z "$COOLIFY_ENDPOINT_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Warning: COOLIFY_ENDPOINT_URL or COOLIFY_TOKEN not set, skipping deployment"
            exit 0
          fi
          echo "Using COOLIFY_ENDPOINT_URL: $COOLIFY_ENDPOINT_URL"
          if [ -z "$COOLIFY_ENV_API" ]; then
            echo "Warning: COOLIFY_ENV_API not set, skipping deployment"
            exit 0
          fi
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Warning: Manifest file not found at $MANIFEST_PATH, skipping deployment"
            exit 0
          fi
          pnpm dlx coolify-deploy --manifest "$MANIFEST_PATH" apply --tag "${{ steps.sha.outputs.sha }}"
