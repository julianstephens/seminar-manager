server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        application/javascript js;
        text/css css;
        application/json json;
        image/svg+xml svg;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
